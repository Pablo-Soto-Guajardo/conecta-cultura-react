# Configuración de Nginx para servir Conecta Cultura como SPA.
# Destino en la instancia EC2: /etc/nginx/sites-available/conecta-cultura
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/conecta-cultura;
    index index.html;

    location / {
        # Si la URL no es un archivo real, entrega index.html
        # para que React Router interprete la ruta.
        try_files $uri $uri/ /index.html;
    }
}
